name: Huynle release
on:
  push:
    tags:
    - v*.*.*-huynle.*
permissions: {}
concurrency:
  group: huynle-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version-file: go.mod
        cache: false
    - name: Validate tag and ancestry
      id: version
      env:
        TAG: ${{ github.ref_name }}
      run: 'set -eu

        printf ''%s\n'' "$TAG" | grep -Eq ''^v[0-9]+\.[0-9]+\.[0-9]+-huynle\.[0-9]+$''
        || exit 1

        git merge-base --is-ancestor "$GITHUB_SHA" origin/master

        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

        '
    - name: Test and build release assets
      run: 'set -eu

        # issue3126.txtar greps rendered template data for "foo" and "bar";

        # pin the kernel hostname so host metadata cannot cause a false match.

        old_hostname=$(hostname)

        sudo hostname chezmoi-ci

        sudo sed -i "s/$old_hostname/chezmoi-ci/g" /etc/hosts /etc/hostname

        go test ./...

        epoch=$(git show -s --format=%ct "$GITHUB_SHA")

        scripts/huynle-release.sh build "$GITHUB_REF_NAME" "$GITHUB_SHA" "$epoch"
        dist

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: unsigned
        path: dist/
        if-no-files-found: error
        retention-days: 7
  sign:
    name: Minisign final native-signed assets
    needs:
    - build
    - macos-sign
    - windows-sign
    runs-on: ubuntu-latest
    environment: fleet-release
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unsigned
        path: dist
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: macos-signed
        path: mac-native
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: windows-signed
        path: win-native
    - name: Install minisign
      run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
    - name: Sign canonical tree and package release assets
      env:
        MINISIGN_KEY: ${{ secrets.FLEET_RELEASE_MINISIGN_KEY }}
        RELEASE_PUBKEY: ${{ vars.FLEET_RELEASE_PUBKEY }}
        VERSION: ${{ needs.build.outputs.version }}
      run: 'set -eu

        umask 077

        key="$RUNNER_TEMP/release.key"

        trap ''rm -f "$key"'' EXIT

        test -n "$MINISIGN_KEY"

        printf ''%s\n'' "$RELEASE_PUBKEY" | grep -Eq ''^RW[A-Za-z0-9+/]{54}$''

        printf ''%s\n'' "$MINISIGN_KEY" > "$key"

        minisign -R -s "$key" -p "$RUNNER_TEMP/derived.pub" < /dev/null >/dev/null

        test "$(tail -n 1 "$RUNNER_TEMP/derived.pub")" = "$RELEASE_PUBKEY"

        printf ''untrusted comment: fleet release public key\n%s\n'' "$RELEASE_PUBKEY"
        > dist/release.pub

        test -f mac-native/apple-signing.ndjson

        test -f win-native/windows-signing.json

        test -f mac-native/chezmoi-darwin-amd64

        test -f win-native/chezmoi-windows-amd64.exe

        epoch=$(git show -s --format=%ct "$GITHUB_SHA") scripts/huynle-release.sh
        merge-native dist mac-native win-native "$VERSION"

        scripts/huynle-release.sh sign-package "v$VERSION" "$epoch" dist "$key" "$RELEASE_PUBKEY"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signed
        path: dist/
        if-no-files-found: error
        retention-days: 30
  publish:
    needs:
    - build
    - sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: signed
        path: dist
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        VERSION: ${{ needs.build.outputs.version }}
      run: "set -eu\narchive=\"dist/chezmoi-fleet-dl-$VERSION.tar.gz\"\ntest -f \"\
        $archive\"\ntest -f \"$archive.minisig\"\ngrep -Fq \"  $(basename \"$archive\"\
        )\" dist/SHA256SUMS\ngh release create \"$TAG\" --repo \"$GITHUB_REPOSITORY\"\
        \ --verify-tag \\\n  --title \"chezmoi $VERSION\" \\\n  --notes \"Huynle fleet\
        \ build from source. Unpack the signed fleet-dl archive directly into the\
        \ fleet-server web root. Verify SHA256SUMS and all .minisig files with release.pub.\"\
        \ \\\n  dist/chezmoi-* dist/manifest.json dist/manifest.json.minisig \\\n\
        \  dist/release.pub dist/release.pub.minisig dist/SHA256SUMS dist/SHA256SUMS.minisig\n"
  macos-sign:
    needs: build
    runs-on: macos-15
    environment: fleet-code-signing
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unsigned
        path: dist
    - name: Native sign macOS
      env:
        APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      run: 'set -euo pipefail; umask 077

        for n in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY
        APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID APPLE_SIGNING_IDENTITY;
        do test -n "${!n}"; done

        keychain="$RUNNER_TEMP/signing.keychain-db"; p12="$RUNNER_TEMP/cert.p12";
        api="$RUNNER_TEMP/AuthKey.p8"; trap ''security delete-keychain "$keychain"
        >/dev/null 2>&1 || true; rm -f "$p12" "$api"'' EXIT

        printf %s "$APPLE_CERTIFICATE_P12"|base64 --decode >"$p12"; printf %s "$APPLE_API_PRIVATE_KEY"|base64
        --decode >"$api"; security create-keychain -p "" "$keychain"; security import
        "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign;
        security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
        >/dev/null; security list-keychains -d user -s "$keychain"

        mkdir native; : >native/apple-signing.ndjson

        for f in dist/chezmoi-darwin-amd64 dist/chezmoi-darwin-arm64; do codesign
        --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$f";
        codesign --verify --deep --strict "$f"; d=$(codesign -dvvv --requirements
        - "$f" 2>&1); team=$(printf ''%s\n'' "$d"|sed -n ''s/^TeamIdentifier=//p'');
        auth=$(printf ''%s\n'' "$d"|sed -n ''s/^Authority=//p''|head -1); test "$team"
        = "$APPLE_TEAM_ID"; test "$auth" = "$APPLE_SIGNING_IDENTITY"; stage="$RUNNER_TEMP/stage-${f##*-}";
        mkdir "$stage"; cp "$f" "$stage/"; dmg="native/${f##*/}.dmg"; hdiutil create
        -quiet -fs HFS+ -srcfolder "$stage" "$dmg"; codesign --force --timestamp --sign
        "$APPLE_SIGNING_IDENTITY" "$dmg"; xcrun notarytool submit "$dmg" --key "$api"
        --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait; xcrun
        stapler staple "$dmg"; xcrun stapler validate "$dmg"; spctl --assess --type
        open --context context:primary-signature --verbose=2 "$dmg"; codesign --verify
        --strict "$dmg"; cp "$f" native/; printf ''{"file":"%s","team_id":"%s","authority":"%s"}\n''
        "${f##*/}" "$team" "$auth">>native/apple-signing.ndjson; done'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: macos-signed
        path: native/
        if-no-files-found: error
  windows-sign:
    needs: build
    runs-on: windows-2025
    environment: fleet-code-signing
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: unsigned
        path: dist
    - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
      with:
        endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        files: ${{ github.workspace }}\dist\chezmoi-windows-amd64.exe,${{ github.workspace
          }}\dist\chezmoi-windows-arm64.exe
        file-digest: SHA256
    - name: Verify
      shell: pwsh
      env:
        WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        WINDOWS_CERT_THUMBPRINT: ${{ vars.WINDOWS_CERT_THUMBPRINT }}
      run: $rows=@(); Get-ChildItem dist/chezmoi-windows-*.exe | % { signtool verify
        /pa /all /v $_.FullName; $s=Get-AuthenticodeSignature $_; if($s.Status -ne
        'Valid' -or $s.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_SUBJECT
        -or $s.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_THUMBPRINT){throw
        'policy mismatch'}; $rows+=@{file=$_.Name;Subject=$s.SignerCertificate.Subject;Thumbprint=$s.SignerCertificate.Thumbprint}
        }; mkdir native; Copy-Item dist/chezmoi-windows-*.exe native/; $rows|ConvertTo-Json
        -Compress|Set-Content native/windows-signing.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: windows-signed
        path: native/
        if-no-files-found: error
